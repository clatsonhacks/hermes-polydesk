name: e2e

# Unit tests, the Hermes plugin-catalog admission checks run exactly as the catalog CI runs
# them (structural + pinned-sha validate), then a live end-to-end run through a real Hermes
# install against the live Polymarket API and Base Sepolia.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==8.3.4
      - run: bash .github/annotate.sh "unit tests" python -m pytest tests -q --tb=short -p no:cacheprovider

  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Clone Hermes (full history so the version resolves from tags)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes"
          git -C "$RUNNER_TEMP/hermes" log -1 --format='Hermes main @ %h %cd'
          echo "A=$GITHUB_WORKSPACE/plugin/.github/annotate.sh" >> "$GITHUB_ENV"
          # A private interpreter for the catalog scripts, independent of the Hermes toolchain PATH.
          /usr/bin/python3 -m venv "$RUNNER_TEMP/catvenv"
          "$RUNNER_TEMP/catvenv/bin/pip" install -q ruamel.yaml==0.18.17
          echo "CATPY=$RUNNER_TEMP/catvenv/bin/python" >> "$GITHUB_ENV"

      - name: Prepare the locked Python toolchain
        working-directory: ${{ runner.temp }}/hermes
        run: |
          set -euo pipefail
          python3 -S scripts/ci/setup_toolchain.py prepare --toolchain python --home "$RUNNER_TEMP/hermes/.build/pm"
          python3 -S scripts/ci/setup_toolchain.py install --toolchain python --home "$RUNNER_TEMP/hermes/.build/pm"

      - name: Build the Hermes runtime and put `hermes` on PATH
        working-directory: ${{ runner.temp }}/hermes
        run: |
          set -euo pipefail
          py=$("$HERMES_PYTHON" - <<'PY'
          from pathlib import Path
          import os
          from pm import build_environment
          src = Path(os.getcwd())
          print(build_environment(source=src, out=src / ".build/validator", explicit=True))
          PY
          )
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s" -m hermes_cli.main "$@"\n' "$py" > "$RUNNER_TEMP/bin/hermes"
          chmod +x "$RUNNER_TEMP/bin/hermes"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "HERMES_RUNTIME_PY=$py" >> "$GITHUB_ENV"
          echo "HERMES_HOME=$RUNNER_TEMP/hermes-home" >> "$GITHUB_ENV"

      - name: hermes plugins validate (same as catalog CI)
        run: |
          hermes --version || true
          bash "$A" "hermes plugins validate" hermes plugins validate --install-deps "$GITHUB_WORKSPACE/plugin"

      - name: Catalog structural check on our entry
        working-directory: ${{ runner.temp }}/hermes
        run: |
          set -euo pipefail
          sed "s/PINNED_SHA/$GITHUB_SHA/" "$GITHUB_WORKSPACE/plugin/.github/catalog-entry.yaml" > plugin-catalog/polydesk.yaml
          bash "$A" "catalog structural" "$CATPY" scripts/validate_plugin_catalog.py plugin-catalog/

      - name: Catalog pinned-sha gate (clone at this sha, validate, payload and self-update scans)
        working-directory: ${{ runner.temp }}/hermes
        env:
          CHANGED_FILES: plugin-catalog/polydesk.yaml
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          # The gate shells out to `python3` for its entry parser, which needs ruamel.yaml.
          export PATH="$RUNNER_TEMP/catvenv/bin:$PATH"
          # In the catalog CI the workspace IS the hermes-agent checkout; the gate resolves its
          # payload scanner from there.
          GITHUB_WORKSPACE="$RUNNER_TEMP/hermes" bash "$A" "catalog pinned-sha gate" "$CATPY" -I scripts/ci/catalog_validate_pinned_entries.py

      - name: Install the plugin into a fresh Hermes profile
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME/plugins/polydesk"
          cd "$GITHUB_WORKSPACE/plugin"
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t "$HERMES_HOME/plugins/polydesk"
          bash "$A" "plugins enable" hermes plugins enable polydesk
          bash "$A" "plugins list" hermes plugins list
          hermes plugins show polydesk || true
          # Publish what Hermes reports about the plugin (readable without login).
          body=$( { hermes plugins list 2>&1 | grep -i -A3 poly; hermes plugins show polydesk 2>&1; } | tail -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=hermes plugins show polydesk::${body}"

      - name: Live end-to-end (real Polymarket + Base Sepolia through Hermes tool dispatch)
        working-directory: ${{ runner.temp }}/hermes
        run: bash "$A" "live e2e" "$HERMES_RUNTIME_PY" "$GITHUB_WORKSPACE/plugin/tests/live_e2e.py"
